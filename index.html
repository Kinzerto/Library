<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Library</h1>
        <button class="open-modal">+ Add Book</button>
    </header>
    <main>
    </main>

    <dialog class="dialog" closedby="closerequest">
        <button class="close" >X</button>
        <form method="dialog">
            <p>
                <label for="book-name">Book</label>
                <input type="text" name="book" id="book-name" autofocus required>
            </p>
            <p>
                <label for="author">Author</label>
                <input type="text" name="author" id="author" required>
            </p>
            <p>
                <label for="page">Page</label>
                <input type="number" name="page" id="page" required>
            </p>
            <button type="submit" class="submit">Submit</button>
        </form>
    </dialog>
</body>

</html>
